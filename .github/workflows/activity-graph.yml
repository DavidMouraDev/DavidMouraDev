name: Generate Activity Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: ashutosh00710/github-readme-activity-graph@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: DavidMouraDev
          OUTPUT_NAME: github-activity-graph
          BG_COLOR: "000000"
          TITLE_COLOR: "ffffff"
          COLOR: "ffffff"
          LINE: "ffffff"
          POINT: "ffffff"
          AREA: true
          HIDE_BORDER: true
